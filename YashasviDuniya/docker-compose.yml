version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: yashasvi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yashasvi}
      POSTGRES_USER: ${POSTGRES_USER:-yashasvi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yashasvi_user} -d ${POSTGRES_DB:-yashasvi}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yashasvi-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yashasvi-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yashasvi_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-yashasvi}
      JWT_SECRET: ${JWT_SECRET:-replace_with_strong_value}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SSO_PROVIDER: ${SSO_PROVIDER:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_AUTH_URL: ${SSO_AUTH_URL:-}
      SSO_TOKEN_URL: ${SSO_TOKEN_URL:-}
      SSO_USERINFO_URL: ${SSO_USERINFO_URL:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://localhost/auth/callback}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yashasvi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: yashasvi-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - yashasvi-network

volumes:
  postgres_data:

networks:
  yashasvi-network:
    driver: bridge
