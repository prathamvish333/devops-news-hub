apiVersion: apps/v1
kind: Deployment
metadata:
  name: yashasvi-frontend
  namespace: yashasvi-duniya
  labels:
    app: yashasvi-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yashasvi-frontend
  template:
    metadata:
      labels:
        app: yashasvi-frontend
    spec:
      containers:
        - name: frontend
          image: ${DOCKER_REGISTRY}/yashasvi-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: yashasvi-frontend
  namespace: yashasvi-duniya
spec:
  selector:
    app: yashasvi-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
