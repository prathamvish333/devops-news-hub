apiVersion: apps/v1
kind: Deployment
metadata:
  name: yashasvi-backend
  namespace: yashasvi-duniya
  labels:
    app: yashasvi-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yashasvi-backend
  template:
    metadata:
      labels:
        app: yashasvi-backend
    spec:
      containers:
        - name: backend
          image: ${DOCKER_REGISTRY}/yashasvi-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: yashasvi-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: yashasvi-secrets
                  key: JWT_SECRET
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              value: "60"
            - name: SSO_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: yashasvi-sso-secrets
                  key: SSO_PROVIDER
                  optional: true
            - name: SSO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: yashasvi-sso-secrets
                  key: SSO_CLIENT_ID
                  optional: true
            - name: SSO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: yashasvi-sso-secrets
                  key: SSO_CLIENT_SECRET
                  optional: true
            - name: SSO_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: yashasvi-sso-secrets
                  key: SSO_AUTH_URL
                  optional: true
            - name: SSO_TOKEN_URL
              valueFrom:
                secretKeyRef:
                  name: yashasvi-sso-secrets
                  key: SSO_TOKEN_URL
                  optional: true
            - name: SSO_USERINFO_URL
              valueFrom:
                secretKeyRef:
                  name: yashasvi-sso-secrets
                  key: SSO_USERINFO_URL
                  optional: true
            - name: SSO_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: yashasvi-sso-secrets
                  key: SSO_REDIRECT_URI
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: yashasvi-backend
  namespace: yashasvi-duniya
spec:
  selector:
    app: yashasvi-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
