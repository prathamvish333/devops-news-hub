apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yashasvi-ingress
  namespace: yashasvi-duniya
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  rules:
    - host: yashasvi-duniya.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: yashasvi-backend
                port:
                  number: 8000
          - path: /(.*)
            pathType: Prefix
            backend:
              service:
                name: yashasvi-frontend
                port:
                  number: 80
---
# For production with TLS
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yashasvi-ingress-tls
  namespace: yashasvi-duniya
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - yashasvi-duniya.example.com
      secretName: yashasvi-tls-secret
  rules:
    - host: yashasvi-duniya.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: yashasvi-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yashasvi-frontend
                port:
                  number: 80
